name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./...

      - name: Build Windows GUI Binary
        run: |
          go build -ldflags="-H windowsgui -s -w" -o TinyProxyAPI.exe .

      - name: Prepare Release Package
        shell: pwsh
        run: |
          $TagName = "${{ github.ref_name }}"
          $DistDir = "TinyProxyAPI-${TagName}-windows-amd64"
          New-Item -ItemType Directory -Path $DistDir

          Copy-Item "TinyProxyAPI.exe" -Destination $DistDir
          Copy-Item "config.toml.example" -Destination $DistDir
          Copy-Item "README.md" -Destination $DistDir
          Copy-Item "README_EN.md" -Destination $DistDir
          Copy-Item "LICENSE" -Destination $DistDir

          $ZipName = "${DistDir}.zip"
          Compress-Archive -Path "$DistDir\*" -DestinationPath $ZipName

          $Hash = (Get-FileHash -Path $ZipName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ZipName" | Out-File -FilePath "${ZipName}.sha256" -Encoding ascii

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TinyProxyAPI-*-windows-amd64.zip
            TinyProxyAPI-*-windows-amd64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
